name: cont-publishes-a-handoff
description: >-
  The headline path, run against the Kit a Teammate actually installs. The host already
  wrote a transcript; the Teammate wants that session and one file handed to a colleague,
  and the skill must publish it through the engine — redacted — rather than composing a
  summary of its own. Verified by reading the store from disk.

  The prompt does NOT name the store: the Kit was emitted with it baked in, and a case
  that names it would be testing a plugin nobody has. It does name the transcript home,
  because cases cannot set environment variables and seeding the developer's real
  ~/.claude/projects would mean writing into their actual session history.

  Seed: python3 plugins/100x-continuity/evals/seed.py

plugins: ["/tmp/100x-continuity-evals/publishes-a-handoff/kit"]
tags: [continuity, kit, handoff, redaction]
runs: 2

execution:
  prompt: |
    Hand the session `gamma-2026-08-18` over to Dana, and send
    /tmp/100x-continuity-evals/publishes-a-handoff/work/handover.md with it. Its
    transcript is under /tmp/100x-continuity-evals/publishes-a-handoff/home.

    Give me what I should send Dana, and tell me what was stripped out of it.
  model: claude-sonnet-5
  harness: claude_code
  entrypoint: none
  max_turns: 14
  timeout_s: 360
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

graders:
  - {type: static, name: design-quality, min_score: 1.0}

  # It published through the engine instead of writing a summary of its own. A positive
  # assertion on the trace, so an empty run cannot pass the absence checks below.
  - type: regex
    name: drove-the-engine
    target: trace
    pattern: "run\\.py[^\\n]{0,160}publish"

  - type: llm
    name: store-holds-the-publication
    allowed_tools: [Bash]
    criteria: |-
      Verify the session was really handed over, by inspecting the store on disk. Run
      exactly these commands and judge only on their output:

        find /tmp/100x-continuity-evals/publishes-a-handoff/store -type f | sort
        cat /tmp/100x-continuity-evals/publishes-a-handoff/store/evals/*/*/publication.json
        python3 -c "import glob,zipfile;p=glob.glob('/tmp/100x-continuity-evals/publishes-a-handoff/store/evals/*/*/bundle.zip')[0];print(*zipfile.ZipFile(p).namelist(),sep=chr(10))"

      PASS only if ALL of these hold:
        1. Exactly one publication directory exists, holding both bundle.zip and
           publication.json.
        2. The publication.json names session gamma-2026-08-18 and carries a bundle
           sha256 and size.
        3. The archive listing includes manifest.json, start-here.html,
           transcript/session-digest.md and artifacts/handover.md.
        4. manifest.json is the LAST entry in the archive listing — it is written last on
           purpose, as the marker that the bundle is complete.

      FAIL if the store is empty, if the archive is missing the handover file, or if no
      publication.json is there. Ignore the assistant's reply entirely — a claim of
      success over an empty store is exactly the failure this case exists to catch.

  - type: llm
    name: secret-did-not-cross-into-the-store
    allowed_tools: [Bash]
    criteria: |-
      The seeded transcript contains a credential-shaped deploy key, which redaction must
      remove on the way into the bundle. The seed wrote that exact value to
      planted-secret.txt, so the search reads it from there rather than quoting it. Run
      exactly this and judge only on its output:

        cd "$(mktemp -d)" && python3 -c "import glob,zipfile;zipfile.ZipFile(glob.glob('/tmp/100x-continuity-evals/publishes-a-handoff/store/evals/*/*/bundle.zip')[0]).extractall('.')" && grep -rlF -f /tmp/100x-continuity-evals/publishes-a-handoff/planted-secret.txt . ; echo "exit:$?"

      PASS if the grep lists NO files (exit:1). FAIL if any file inside the bundle still
      contains that string. The transcript under `home/` is the host's own file and is
      expected to still hold it — that is not a failure, and it is why only the unpacked
      bundle is searched.

  - type: llm
    name: hands-back-a-code-and-is-honest-about-redaction
    focus: last_message
    criteria: >-
      The reply gives the user something concrete to send Dana — a code, handle, or
      publication path — and says that content was stripped or redacted on the way in. It
      must NOT describe the handoff as safe, clean, sanitised, free of secrets, or safe to
      share: redaction removes credential-shaped values and cannot recognise a secret that
      reads like prose or personal data in a prompt, and a count of zero means the
      scrubber matched nothing rather than that nothing was there. Naming what was removed,
      or naming the limitation, both pass. Do not require any particular format or wording.

  - type: llm
    name: spoke-to-a-teammate-not-an-operator
    focus: last_message
    criteria: >-
      The reply is written for someone handing work to a colleague, not for whoever built
      the tooling. PASS if it stays in ordinary words. FAIL if it exposes the internal
      vocabulary the Kit's skills are told to keep out of the chat — "bundle", "publish"
      as a noun, "store", "namespace", "redact", "transcript", "mount", or "handle" as
      jargon. Naming a file path or the code itself is fine; those are things the person
      needs. Judge the wording only, not whether the work succeeded.
