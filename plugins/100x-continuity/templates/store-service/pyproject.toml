[project]
name = "continuity-store"
version = "0.1.0"
description = "A store service for 100x-continuity, as an MCP server you run"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0",
  "boto3>=1.34",
]

# Deliberately minimal. This template is meant to be copied into your own service and
# adapted, not installed as a dependency — so it pins nothing you would have to unpin.
