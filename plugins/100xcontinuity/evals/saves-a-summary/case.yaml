name: continuity-saves-a-summary
description: >-
  Happy path. A user asks for work to be kept for tomorrow; the skill must actually write
  it into the store. Verified by reading the store from disk, never from the transcript —
  a model that says "saved!" and wrote nothing must fail this case.

  Seed: python3 plugins/100xcontinuity/evals/seed.py (starts from an empty store).

plugins: ["../.."]
tags: [continuity, happy-path]
# 3, not 1. This prompt intermittently trips a runner-side safety classifier — the same
# command refuses on one attempt and completes on the next, with identical benign content.
# The harness surfaces that as a bare `claude exited 1`, so at runs:1 the case is a
# coin-flip that reads as a hard failure. Three runs turn runtime flakiness into a visible
# passRate instead, which is what this field is for.
runs: 3

execution:
  prompt: |
    Keep this for tomorrow so I can pick it back up — my continuity store is at
    /tmp/100xcontinuity-evals/saves-a-summary, namespace evals, session beta-2026-08-13.
    Call it handover.md.

    We moved the Vega migration behind a flag (default off), dropped the nightly
    reconcile job, and we're blocked on finance sign-off for the Q3 true-up.
  model: claude-sonnet-5
  harness: claude_code
  entrypoint: none
  max_turns: 12
  timeout_s: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

graders:
  # Free and deterministic — the design gate this repo holds every plugin to.
  - {type: static, name: design-quality, min_score: 1.0}

  # It went through the engine rather than hand-rolling a file write. Checked on the
  # trace, so this fails if it improvised its own storage layout.
  - type: regex
    name: drove-the-engine
    target: trace
    pattern: "run\\.py[^\\n]{0,80}save"

  # The one that matters: the judge reads the STORE, not the answer.
  - type: llm
    name: store-really-holds-it
    allowed_tools: [Bash]
    criteria: |-
      Verify the artifact was really written, by inspecting the store on disk. Run
      exactly these commands and judge only on their output:

        find /tmp/100xcontinuity-evals/saves-a-summary -type f | sort
        cat /tmp/100xcontinuity-evals/saves-a-summary/sessions/*/entries/*.json

      PASS only if ALL of these hold:
        1. At least one file exists under a `sessions/<64-hex>/blobs/` directory.
        2. At least one JSON file exists under `sessions/<64-hex>/entries/`.
        3. Some entry JSON has "name" exactly "handover.md".
        4. That entry's "resolved" field is true (the session id was attributed).
        5. The blob whose filename equals that entry's "sha256" exists and is non-empty,
           and its text mentions the Vega migration.

      FAIL if the store is empty, if no entry names handover.md, or if an entry names a
      sha256 with no matching blob file. Do not read the assistant's reply — a claim of
      success with an empty store is exactly the failure this case exists to catch.

  - type: llm
    name: confirms-without-overclaiming
    focus: last_message
    criteria: >-
      The reply confirms the note was saved and makes it possible to get it back later —
      naming the artifact, the session, or the store. It must NOT claim the content has
      been backed up, uploaded, or synced to the cloud: the plugin writes to local disk
      and the sync client, if any, is not observable from here. Mentioning that a synced
      folder would upload it later is fine; stating that it HAS reached the cloud is not.
      Do not require any particular format or wording.
