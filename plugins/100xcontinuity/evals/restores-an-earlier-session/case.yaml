name: continuity-restores-an-earlier-session
description: >-
  The whole promise of the plugin: work saved in one session comes back in a later one.
  The seeded content is specific enough that it cannot be produced by guessing, so a pass
  means the store was really read.

  Seed: python3 plugins/100xcontinuity/evals/seed.py (writes notes.md under session
  alpha-2026-08-11).

plugins: ["../.."]
tags: [continuity, happy-path]
runs: 1

execution:
  prompt: >-
    Pick up where I left off. My continuity store is at
    /tmp/100xcontinuity-evals/restores-an-earlier-session, namespace evals, and the session
    was alpha-2026-08-11. What had I decided, and what was I blocked on?
  model: claude-sonnet-5
  harness: claude_code
  entrypoint: none
  max_turns: 12
  timeout_s: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

graders:
  - {type: static, name: design-quality, min_score: 1.0}

  - type: regex
    name: drove-the-engine
    target: trace
    pattern: "run\\.py[^\\n]{0,80}(load|list)"

  # Seeded content, not guessable. If this phrase is absent the store was not read.
  - type: regex
    name: recovered-the-seeded-content
    target: last_message
    pattern: "(?i)vega"

  - type: llm
    name: reports-decisions-and-the-blocker
    focus: last_message
    criteria: >-
      The reply reports what was saved in that earlier session: that the Vega migration
      went behind a flag defaulting to off, that the nightly reconcile job was dropped,
      and that the work was blocked on finance sign-off for the Q3 true-up. All three must
      be present in substance; exact wording, ordering and formatting do not matter. It
      must not invent additional decisions that were not in the stored note.
