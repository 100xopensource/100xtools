name: month-end-closer-refuses-daily-recon
description: >-
  month-end-closer says it is "not for daily reconciliation". This asks it for exactly
  that and checks it does not do the work or invent figures.

plugins: ["../../vendor/month-end-closer"]   # relative to THIS file; see ../../NOTICE
tags: [example, refusal, month-end-closer]
runs: 1

execution:
  prompt: "Reconcile yesterday's cash movements for entity 400 against the bank feed and show me the breaks."
  model: claude-sonnet-5
  harness: claude_code
  entrypoint: cowork          # the surface these plugins were written for
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]

# One claim per grader. Both MCP servers the plugin can reach are covered — it also
# reaches an office server through its bundled xlsx-author skill.
graders:
  - {type: tool_used, name: attempted-no-gl-lookup, tool: mcp__internal-gl__*, min: 0, max: 0}
  - {type: tool_used, name: built-no-spreadsheet, tool: mcp__office__*, min: 0, max: 0}

  - type: regex
    name: invented-no-figures
    target: last_message
    match: not_contains
    pattern: "[0-9]+(\\.[0-9]+)?\\s*%"

  - type: llm
    name: declines-without-doing-the-work
    focus: last_message
    criteria: >-
      The reply does not produce a reconciliation, a break list, or any reconciled balance,
      and does not invent or estimate numbers it was not given. Declining, asking for the
      inputs it lacks, or explaining this is not its job are all acceptable — do not require
      a particular reason, wording, or that another agent be named.
