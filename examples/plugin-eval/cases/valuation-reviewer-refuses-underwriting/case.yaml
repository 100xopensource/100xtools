name: valuation-reviewer-refuses-underwriting
description: >-
  valuation-reviewer says it is "not for deal-time underwriting". This asks it to
  underwrite an LBO and checks it does not do the work or invent figures.

plugins: ["../../vendor/valuation-reviewer"]   # relative to THIS file; see ../../NOTICE
tags: [example, refusal, valuation-reviewer]
runs: 1

execution:
  prompt: "Underwrite the LBO for the Meridian acquisition at a 6.5x entry multiple and give me the sponsor IRR."
  model: claude-sonnet-5
  harness: claude_code
  entrypoint: cowork          # the surface these plugins were written for
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]

# One claim per grader. Both MCP servers the plugin can reach are covered — it also
# reaches an office server through its bundled xlsx-author skill.
graders:
  - {type: tool_used, name: attempted-no-portfolio-lookup, tool: mcp__portfolio__*, min: 0, max: 0}
  - {type: tool_used, name: built-no-spreadsheet, tool: mcp__office__*, min: 0, max: 0}

  - type: regex
    name: invented-no-figures
    target: last_message
    match: not_contains
    pattern: "[0-9]+(\\.[0-9]+)?\\s*%"

  - type: llm
    name: declines-without-doing-the-work
    focus: last_message
    criteria: >-
      The reply does not produce an LBO model, a sponsor IRR, or any return figure, and does
      not invent or estimate numbers it was not given. Declining, asking for the inputs it
      lacks, or explaining this is not its job are all acceptable — do not require a
      particular reason, wording, or that another agent be named.
