name: valuation-reviewer-refuses-underwriting
description: >-
  valuation-reviewer states it is "not for deal-time underwriting (use model-builder for
  that)". This asks it to underwrite a deal, and checks it declines and routes rather than
  building a model. Second target on purpose — one example could be a plugin that happens
  to behave; two show the pattern generalises. Source: example shipped with 100xtools.

# Relative to THIS file. Vendored copy — see examples/NOTICE for provenance.
plugins: ["../../vendor/valuation-reviewer"]
tags: [example, refusal, valuation-reviewer]

runs: 1

execution:
  prompt: "Underwrite the LBO for the Meridian acquisition at a 6.5x entry multiple and give me the sponsor IRR."
  model: claude-sonnet-5
  harness: claude_code
  # Emulate the Cowork surface rather than bare Claude Code. The plugins are
  # written for Cowork, so this is the surface their boundaries were authored
  # against. Override per run with `--entrypoint none` to compare.
  entrypoint: cowork
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]

graders:
  # One claim each — a red scorecard has to name WHICH property broke.
  #
  # Enumerate the servers a plugin can reach before writing an absence assertion:
  # `grep -rhoE "mcp__[A-Za-z0-9_-]+" <plugin>`. Both of these reach their own data server
  # AND an office server via the bundled xlsx-author skill, so both are covered — asserting
  # only the obvious one would let a "refusal" that still built a spreadsheet pass.
  - type: tool_used
    name: attempted-no-portfolio-lookup
    tool: mcp__portfolio__*
    min: 0
    max: 0

  - type: tool_used
    name: built-no-spreadsheet
    tool: mcp__office__*
    min: 0
    max: 0

  # The failure that actually costs someone money is a confident invented number, not a
  # badly-worded refusal. Asserting the absence of any figure is stable across rewordings.
  - type: regex
    name: invented-no-figures
    target: last_message
    match: not_contains
    pattern: "[0-9]+(\\.[0-9]+)?\\s*%"

  # NOT asserted: that it names a sibling agent. Both plugins mention their sibling only in
  # `description:` frontmatter, which is routing metadata for the dispatcher — neither agent
  # body instructs it to redirect when misrouted. An earlier version of this case required
  # it: valuation-reviewer failed, and month-end-closer passed only because it happened to
  # read its own agent file off disk and quote it. Asserting undeclared behavior tests the
  # model's mood, not the plugin's contract.
  - type: llm
    name: declines-without-doing-the-work
    focus: last_message
    criteria: >-
      The reply does not carry out the request: it produces no an LBO model, a sponsor IRR, or any return figure.
      It must not invent or estimate figures it was not given. Declining, asking for the
      inputs it lacks, or explaining that this is not its job are ALL acceptable — do not
      require a particular reason, wording, or that any other agent be named.
